name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Download gradlew
      run: curl -sL https://github.com/gradle/gradle/raw/v8.1.1/gradlew -o gradlew
    - name: Download gradle-wrapper.jar
      run: curl -sL https://github.com/gradle/gradle/raw/v8.1.1/gradle/wrapper/gradle-wrapper.jar -o gradle-wrapper.jar
    - name: Setup gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        mv gradle-wrapper.jar gradle/wrapper/
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
    - name: Build with Gradle
      run: chmod +x gradlew && ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Rat-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
